receivers:
  filelog/traefik:
    include:
      - /etc/dokploy/traefik/dynamic/access.log
    start_at: end
    operators:
      - type: json_parser
        parse_from: body

  # Ubuntu journald: 你的机器同时存在 /run 和 /var
  # 这里用 /var/log/journal（更稳，包含持久化日志；/run 重启会丢）
  journald:
    directory: /var/log/journal

processors:
  attributes/traefik:
    actions:
      - key: service.name
        value: traefik
        action: upsert

  attributes/openvpn:
    actions:
      - key: service.name
        value: openvpn
        action: upsert

  transform/traefik_fields:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # ---- 基础字段（与你给的 Traefik JSON 完全匹配）----
          - set(attributes["host"], body["RequestHost"]) where body["RequestHost"] != nil
          - set(attributes["path"], body["RequestPath"]) where body["RequestPath"] != nil
          - set(attributes["method"], body["RequestMethod"]) where body["RequestMethod"] != nil
          - set(attributes["status"], body["DownstreamStatus"]) where body["DownstreamStatus"] != nil
          - set(attributes["router"], body["RouterName"]) where body["RouterName"] != nil
          - set(attributes["service"], body["ServiceName"]) where body["ServiceName"] != nil

          # ---- 客户端 IP：优先 ClientHost，其次 ClientAddr 去端口 ----
          - set(attributes["client_ip"], body["ClientHost"]) where body["ClientHost"] != nil
          - set(attributes["client_ip"], ReplacePattern(body["ClientAddr"], ":.*$", "")) where body["ClientHost"] == nil and body["ClientAddr"] != nil

          # ---- 耗时：Traefik Duration 是 ns（你给的示例是 1470652361ns）换算 ms ----
          - set(attributes["duration_ms"], Double(body["Duration"]) / 1000000.0) where body["Duration"] != nil

  batch: {}

exporters:
  # 发给 SigNoz 自带 collector
  # 你的 compose service 名是 otel-collector（container_name 叫 signoz-otel-collector）
  otlp:
    endpoint: otel-collector:4317
    tls:
      insecure: true

service:
  pipelines:
    logs/traefik:
      receivers: [filelog/traefik]
      processors: [attributes/traefik, transform/traefik_fields, batch]
      exporters: [otlp]

    logs/openvpn:
      receivers: [journald]
      processors: [attributes/openvpn, batch]
      exporters: [otlp]
