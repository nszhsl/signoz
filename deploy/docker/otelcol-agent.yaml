receivers:
  filelog/traefik:
    include:
      - /etc/dokploy/traefik/dynamic/access.log
    start_at: end
    operators:
      # 把 Traefik JSON 行解析到 attributes，而不是 body
      - type: json_parser
        parse_from: body
        parse_to: attributes

  journald:
    directory: /var/log/journal

  filelog/gitssh:
    include:
      - /var/lib/docker/containers/*/*.log
    start_at: end
    include_file_path: true
    operators:
      # Docker json-file: {"log":"xxx\n","time":"..."}
      - type: json_parser
        parse_from: body

      # 只保留 Forgejo SSH 相关日志
      - type: filter
        expr: >
          attributes.log matches "(?i)(ssh|publickey|git@|connection from|accepted|failed password)"

      # 把真正的日志内容移到 body
      - type: move
        from: attributes.log
        to: body

      # 去掉末尾换行
      - type: regex_parser
        parse_from: body
        regex: '^(?P<msg>.*?)(\n)?$'
      - type: move
        from: attributes.msg
        to: body
      - type: remove
        field: attributes.msg

processors:
  attributes/traefik:
    actions:
      - key: service.name
        value: traefik
        action: upsert

  attributes/openvpn:
    actions:
      - key: service.name
        value: openvpn
        action: upsert

  transform/traefik_fields:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["host"], attributes["RequestHost"]) where attributes["RequestHost"] != nil
          - set(attributes["path"], attributes["RequestPath"]) where attributes["RequestPath"] != nil
          - set(attributes["method"], attributes["RequestMethod"]) where attributes["RequestMethod"] != nil
          - set(attributes["status"], attributes["DownstreamStatus"]) where attributes["DownstreamStatus"] != nil
          - set(attributes["client_ip"], attributes["ClientHost"]) where attributes["ClientHost"] != nil
          - set(attributes["router"], attributes["RouterName"]) where attributes["RouterName"] != nil
          - set(attributes["upstream_service"], attributes["ServiceName"]) where attributes["ServiceName"] != nil
          - set(attributes["duration_ns"], attributes["Duration"]) where attributes["Duration"] != nil

  attributes/mark_gitssh:
    actions:
      - key: service.name
        value: git-ssh
        action: upsert


  batch: {}

exporters:
  # 你这里的 exporter 写法没问题；只是提醒：0.144 里 otlp alias 会提示弃用
  otlp:
    endpoint: otel-collector:4317
    tls:
      insecure: true

service:
  pipelines:
    logs/traefik:
      receivers: [filelog/traefik]
      processors: [attributes/traefik, transform/traefik_fields, batch]
      exporters: [otlp]

    logs/openvpn:
      receivers: [journald]
      processors: [attributes/openvpn, batch]
      exporters: [otlp]
      
    logs/gitssh:
      receivers: [filelog/gitssh]
      processors: [attributes/mark_gitssh, batch]
      exporters: [otlp]      
