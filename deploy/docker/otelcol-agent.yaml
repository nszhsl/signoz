receivers:
  filelog/traefik:
    include:
      - /etc/dokploy/traefik/dynamic/access.log
    start_at: end
    operators:
      - type: json_parser
        parse_from: body

  journald:
    # 你机器上 /var/log/journal 存在（持久化），更稳
    directory: /var/log/journal
    # 可选：只采 openvpn，减少噪音（后面你想加再加）
    # units:
    #   - openvpn-server@server.service

processors:
  attributes/traefik:
    actions:
      - key: service.name
        value: traefik
        action: upsert

  attributes/openvpn:
    actions:
      - key: service.name
        value: openvpn
        action: upsert

  transform/traefik_fields:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["host"], body["RequestHost"]) where body["RequestHost"] != nil
          - set(attributes["path"], body["RequestPath"]) where body["RequestPath"] != nil
          - set(attributes["method"], body["RequestMethod"]) where body["RequestMethod"] != nil
          - set(attributes["status"], body["DownstreamStatus"]) where body["DownstreamStatus"] != nil
          - set(attributes["client_ip"], body["ClientHost"]) where body["ClientHost"] != nil
          - set(attributes["router"], body["RouterName"]) where body["RouterName"] != nil
          - set(attributes["upstream_service"], body["ServiceName"]) where body["ServiceName"] != nil
          - set(attributes["duration_ns"], body["Duration"]) where body["Duration"] != nil

  batch: {}

exporters:
  otlp:
    endpoint: otel-collector:4317
    tls:
      insecure: true

service:
  pipelines:
    logs/traefik:
      receivers: [filelog/traefik]
      processors: [attributes/traefik, transform/traefik_fields, batch]
      exporters: [otlp]

    logs/openvpn:
      receivers: [journald]
      processors: [attributes/openvpn, batch]
      exporters: [otlp]
