receivers:
  # ---- Traefik access log (JSON file) ----
  filelog/traefik:
    include:
      - /etc/dokploy/traefik/dynamic/access.log
    start_at: end
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes

  # ---- Host SSHD only ----
  journald/sshd:
    directory: /var/log/journal
    units:
      - ssh.service
      - sshd.service

  # ---- OpenVPN only ----
  journald/openvpn:
    directory: /var/log/journal
    units:
      - openvpn-server@server.service

  # ---- Git SSH (2222 -> forgejo:22) ----
  # Read docker json-file logs; filter by SSH-ish keywords.
  filelog/gitssh:
    include:
      - /var/lib/docker/containers/*/*.log
    start_at: end
    include_file_path: true
    operators:
      - type: json_parser
        parse_from: body

      # 过滤出“疑似 SSH/Git SSH”相关日志（适配面最广）
      - type: filter
        expr: 'attributes["log"] matches "(?i)(ssh|publickey|git@|connection from|accepted|failed password|authentication failure|invalid user)"'

      - type: move
        from: attributes.log
        to: body

      # 去掉末尾换行
      - type: regex_parser
        parse_from: body
        regex: '^(?P<msg>.*?)(\n)?$'
      - type: move
        from: attributes.msg
        to: body
      - type: remove
        field: attributes.msg

processors:
  # ---- mark service names ----
  attributes/mark_traefik:
    actions:
      - key: service.name
        value: traefik
        action: upsert

  attributes/mark_sshd:
    actions:
      - key: service.name
        value: sshd
        action: upsert

  attributes/mark_openvpn:
    actions:
      - key: service.name
        value: openvpn
        action: upsert

  attributes/mark_gitssh:
    actions:
      - key: service.name
        value: git-ssh
        action: upsert

  # ---- Traefik field extraction (from attributes) ----
  transform/traefik_fields:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(attributes["host"], attributes["RequestHost"]) where attributes["RequestHost"] != nil
          - set(attributes["path"], attributes["RequestPath"]) where attributes["RequestPath"] != nil
          - set(attributes["method"], attributes["RequestMethod"]) where attributes["RequestMethod"] != nil
          - set(attributes["status"], attributes["DownstreamStatus"]) where attributes["DownstreamStatus"] != nil
          - set(attributes["client_ip"], attributes["ClientHost"]) where attributes["ClientHost"] != nil
          - set(attributes["router"], attributes["RouterName"]) where attributes["RouterName"] != nil
          - set(attributes["upstream_service"], attributes["ServiceName"]) where attributes["ServiceName"] != nil
          - set(attributes["duration_ns"], attributes["Duration"]) where attributes["Duration"] != nil

  batch: {}

exporters:
  # 你现有 SigNoz collector 在同网络内（service 名 otel-collector）
  otlp:
    endpoint: otel-collector:4317
    tls:
      insecure: true

service:
  pipelines:
    logs/traefik:
      receivers: [filelog/traefik]
      processors: [attributes/mark_traefik, transform/traefik_fields, batch]
      exporters: [otlp]

    logs/sshd:
      receivers: [journald/sshd]
      processors: [attributes/mark_sshd, batch]
      exporters: [otlp]

    logs/openvpn:
      receivers: [journald/openvpn]
      processors: [attributes/mark_openvpn, batch]
      exporters: [otlp]

    logs/gitssh:
      receivers: [filelog/gitssh]
      processors: [attributes/mark_gitssh, batch]
      exporters: [otlp]
